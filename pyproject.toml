[project]
name = "distinguo"
version = "0.1.0"
description = "Distinguo : back et calculateur (le front est dans package.json)"
requires-python = ">=3.12"
dependencies = [
    # calculateur
    "numpy>=1.26",
    "scipy>=1.11",
    # contracts/valider.py
    "jsonschema>=4.20",
    # back
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "mistralai>=3.0.0",
    "python-multipart>=0.0.32",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
